server {
    listen 8080;
    host 0.0.0.0;
    server_name localhost;
    client_max_body_size 1M;
    root ./www;
    index index.html;

    location / {
        allow_methods GET;
    }

    location /directory/ {
        root ./YoupiBanane;
		client_max_body_size 100M;
        index youpi.bad_extension;
        allow_methods GET;
    }

    location /post_body {
        root ./www;
        allow_methods POST;
        client_max_body_size 100;
    }

    location /YoupiBanane/ {
        root ./YoupiBanane;
        allow_methods POST;
        cgi_path ./cgi_tester;
        cgi_extension .bla;
    }
}
