# ==========================================
# WEBSERV CONFIGURATION FILE
# ==========================================

# --- SERVER BLOCK 1: The Main Website ---
server {
    # 1. Port and Host/IP
	#token token
	#directive value
    listen 8080;
    host 127.0.0.1;

    # 2. Domain names
    server_name localhost example.com;

    # 3. Default limit for POST requests

    # 4. Error pages
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    # 5. Global rules for this server
    root ./www;
    index index.html default.html;

    # --- LOCATION BLOCK A: The Default Route ---
    location / {
        allow_methods GET;
        autoindex on;
    }

    location /directory {
        allow_methods GET POST;
        root ./YoupiBanane;
        index youpi.bad_extension;
        cgi_extension .bla;
        cgi_path ./cgi_test;
    }

    location /post_body {
        allow_methods POST;
        client_max_body_size 100;
    }

    location /old_site {
        return 301 /;
    }

}

# --- SERVER BLOCK 2: A Second Website ---
# Your parser must handle multiple servers in one file!
server {
    listen 8081;
    server_name test.localhost;
    root ./www_test;

    location / {
        allow_methods GET;
        index test.html;
    }
}